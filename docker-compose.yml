services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - frontend
    healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
        interval: 5s
        timeout: 3s
        retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
        test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\""]
        interval: 5s
        timeout: 3s
        retries: 10

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RECEIVER_URL: ${RECEIVER_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
      receiver:
        condition: service_started
    deploy:
      replicas: 2
    networks:
      - backend
      - webhooks

  receiver:
    build: ./receiver
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    ports:
      - "9000:9000"
    networks:
      - webhooks
    healthcheck:
        test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:9000/health')\""]
        interval: 5s
        timeout: 3s
        retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  frontend:
  backend:
  webhooks:

volumes:
  pgdata:
