map $http_x_request_id $relayops_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format relayops '$remote_addr - [$time_local] "$request" $status rid=$relayops_request_id';

upstream relayops_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    access_log /var/log/nginx/access.log relayops;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $relayops_request_id;
    add_header X-Request-ID $relayops_request_id always;

    location / {
        proxy_pass http://relayops_api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

}
